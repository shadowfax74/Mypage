<!doctype html>
<html lang="ko">

    <title>소프트웨어 개발자 소개</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <script>
      // 파일 탐색기에서 프로젝트 루트의 index.html을 직접 더블클릭했을 때 dist/index.html로 자동 안내

        window.location.replace('./dist/index.html');
      }
    </script>

  <body class="bg-[#0f1115] text-[#d4d4d8] font-sans antialiased selection:bg-[#a3e635]/20 selection:text-[#a3e635]">
